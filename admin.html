<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RS Top Up Admin</title>
<style>body{font-family:Arial;background:#f4f6fb;margin:0;padding:20px}.box{max-width:1100px;margin:auto;background:#fff;padding:20px;border-radius:18px}input,button{padding:12px;border-radius:8px;border:1px solid #ccc}button{cursor:pointer}.row{padding:14px;border-bottom:1px solid #eee}.grid{display:grid;gap:10px}</style></head><body><div class="box"><h1>RS Top Up Admin</h1><input id="key" placeholder="Admin key" style="width:100%"><button onclick="load()">Load Orders</button><div id="out"></div></div><script>
async function load(){const key=document.getElementById("key").value;const r=await fetch("/api/admin/orders",{headers:{"x-admin-key":key}});const d=await r.json();if(!r.ok)return alert(d.error||"Unauthorized");document.getElementById("out").innerHTML=d.map(o=>`<div class="row"><b>${o.id}</b> | ${o.product} | ${o.package_name} | ৳${o.amount} | Payment ${o.payment_status} | Status ${o.status}<br>UID: ${o.uid} | ${o.customer_phone}<br><button onclick="setStatus('${o.id}','PROCESSING')">Processing</button> <button onclick="setStatus('${o.id}','COMPLETED')">Completed</button> <button onclick="setStatus('${o.id}','FAILED')">Failed</button></div>`).join("")}
async function setStatus(id,status){const key=document.getElementById("key").value;const r=await fetch("/api/admin/order/"+id+"/status",{method:"POST",headers:{"content-type":"application/json","x-admin-key":key},body:JSON.stringify({status})});if(r.ok)load();else alert("Update failed")}
</script></body></html>
