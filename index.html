<!-- ORDER MODAL -->
<div class="modal" id="orderModal">

  <div class="modal-box">

    <div class="modal-head">
      <h2>Account Info</h2>
      <button class="close" onclick="closeOrder()">×</button>
    </div>

    <p>আপনার Game UID / Player ID দিন</p>

    <input
      class="input"
      id="playerId"
      type="text"
      placeholder="এখানে UID / Player ID দিন"
    >

    <button class="check" onclick="checkPlayer()">
      Click to check player name
    </button>

    <div class="notice" id="playerResult">
      Product: <b id="selectedProduct">-</b>
      <br><br>
      Player Name: <b id="playerName">Check করা হয়নি</b>
    </div>

  </div>

</div>


<script>

let selectedProduct = "";

function openOrder(product){

  selectedProduct = product;

  document.getElementById("selectedProduct").innerText =
    product;

  document.getElementById("orderModal").style.display =
    "flex";

}

function closeOrder(){

  document.getElementById("orderModal").style.display =
    "none";

}

function checkPlayer(){

  let uid =
    document.getElementById("playerId").value.trim();

  if(uid === ""){
    alert("দয়া করে আপনার UID / Player ID দিন");
    return;
  }
